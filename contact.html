<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Sravya</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">Sravya</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="experience.html">Experience</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="page section contact">
    <div class="section-header">
      <p class="eyebrow">Contact</p>
      <h1>Let’s talk</h1>
      <p class="muted">Fill the quick form or email me directly at <a href="mailto:you@example.com">you@example.com</a>.</p>
    </div>
    <form class="contact-form">
      <div class="form-row">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" />
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="name@email.com" />
      </div>
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="What can we build together?"></textarea>
      </div>
      <button type="submit" class="btn primary full">Send message</button>
    </form>
  </main>

  <footer class="footer">
    <p>© 2025 Sravya — ML + Backend Engineer</p>
  </footer>
</body>
</html>
